<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading Player...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  /* Pulsing JStream logo / circle */
  .loader-ring {
    position: relative;
    width: 80px;
    height: 80px;
    margin-bottom: 32px;
  }
  .loader-ring .ring {
    position: absolute;
    inset: 0;
    border: 3px solid transparent;
    border-top-color: #dc2626;
    border-radius: 50%;
    animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
  }
  .loader-ring .ring:nth-child(2) {
    inset: 8px;
    border-top-color: #f87171;
    animation-delay: -0.15s;
  }
  .loader-ring .ring:nth-child(3) {
    inset: 16px;
    border-top-color: #fca5a5;
    animation-delay: -0.3s;
  }
  .loader-ring .play-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: #dc2626;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes spin {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.15); }
  }

  .title {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    color: #e5e7eb;
  }
  .subtitle {
    font-size: 13px;
    color: #6b7280;
    animation: fadeInOut 2.5s ease-in-out infinite;
  }

  @keyframes fadeInOut {
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 1; }
  }

  /* Progress bar at bottom */
  .progress-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background: #1f2937;
    overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%;
    background: linear-gradient(90deg, #dc2626, #f87171, #dc2626);
    background-size: 200% 100%;
    animation: shimmer 1.5s ease-in-out infinite;
    width: 100%;
  }

  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
</style>
</head>
<body>
  <div class="loader-ring">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="play-icon">▶</div>
  </div>
  <div class="title">Loading Player</div>
  <div class="subtitle">Preparing your stream…</div>
  <div class="progress-bar"><div class="fill"></div></div>
</body>
</html>
